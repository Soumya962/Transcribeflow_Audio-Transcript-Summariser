<!DOCTYPE html>
<html>
<head>
    <title>Register - TranscribeFlow</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 10px;
            width: 350px;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.1);
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #2980b9;
        }

        .login-link {
            text-align: center;
            margin-top: 10px;
        }
        
        a 
        {
            text-decoration: none;
            color: #3498db;
        }
    </style>
</head>
<body>

<div class="card">
    <h2> 
        <center>
         Create Account
       </center>
    </h2>

    <form method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Register</button>
    </form>

    <div class="login-link">
        Already have an account?
        <a href="/">Login</a>
    </div>
</div>

</body>
</html>
